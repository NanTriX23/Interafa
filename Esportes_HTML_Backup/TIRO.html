<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natação - Resultados</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Bebas Neue", sans-serif;
        margin: 0;
        background: #f4f4f4;
        color: #333;
        padding: 30px 20px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .header img {
        width: 60px;
        height: 60px;
      }
      .header h1 {
        font-size: 40px;
        letter-spacing: 2px;
      }

      .results-table {
        width: 100%;
        max-width: 1000px;
        margin: 20px auto;
        border-collapse: collapse;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .results-table th,
      .results-table td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }
      .results-table th {
        background: #222;
        color: #fff;
      }
      .results-table tr:hover {
        filter: brightness(1.08);
      }
      .results-table td img {
        height: 44px;
      }

      .view-switch {
        max-width: 1000px;
        margin: 24px auto 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .view-switch button {
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.5px;
        font-size: 18px;
        padding: 10px 16px;
        border: 1px solid #222;
        background: #fff;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.2s ease, color 0.2s ease;
      }
      .view-switch button:hover {
        transform: translateY(-1px);
      }
      .view-switch button.active {
        background: #222;
        color: #fff;
      }

      .hidden {
        display: none;
      }

      .gallery {
        max-width: 900px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }
      .gallery img:hover {
        transform: scale(1.05);
      }

      .back-button {
        display: block;
        width: max-content;
        margin: 40px auto 0;
        padding: 12px 24px;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        background: #222;
      }
    </style>

    <!-- JS PRINCIPAL: carrega todas as provas e monta as tabelas -->
    <script>
      // Imagens das equipes (ajuste os links se precisar)
      const URL_IMAGENS = {
        Perseu:
          "https://scaer.com.br/wp-content/uploads/2025/06/2025-2029_Perseu_Destaque-removebg-preview-1.png",
        Uiraçu:
          "https://scaer.com.br/wp-content/uploads/2025/11/Uiracuremovido.png",
        Athos:
          "https://scaer.com.br/wp-content/uploads/2025/06/2023-2026_Athos_Destaque-fill-350x351-1.webp", // TODO: ajustar se for outro arquivo
        Ártemis:
          "https://scaer.com.br/wp-content/uploads/2025/11/artemisremovido-.png", // TODO: ajustar se for outro arquivo
      };

      // Degradês por equipe
      const GRADIENTES_EQUIPE = {
        Perseu: "linear-gradient(90deg, #02091E, #12326F)",
        Uiraçu: "linear-gradient(90deg, #3A0202, #FF301A)",
        Athos: "linear-gradient(90deg, #3E2C00, #F4B000)",
        Ártemis: "linear-gradient(90deg, #00331C, #00A86B)",
      };

      // URL do Web App (Apps Script) – troque se você criar um novo deploy
      const URL_PLANILHA =
        "https://script.google.com/macros/s/AKfycbxEOhlppGhGCZxkgKLzMTvnkl_vkNjbnmFJ2R3fUx0496KxZv2ILQX_SQ8ztSGqhwGO0A/exec";

      // -------- FUNÇÃO QUE MONTA A TABELA (modelo igual ao do seu print) --------
      function montarTabela(dados, idTabela) {
        console.log(`Montando tabela ${idTabela}`, dados);

        const tabela = document.getElementById(idTabela);
        if (!tabela) return;

        // mantém as 2 primeiras linhas (título e cabeçalho)
        while (tabela.rows.length > 2) {
          tabela.deleteRow(2);
        }

        dados.forEach((dado) => {
          console.log("Processando dado: " + dado.posicao);

          let linha = document.createElement("tr");

          const gradiente = GRADIENTES_EQUIPE[dado.equipe];
          if (gradiente) {
            linha.style.backgroundImage = gradiente;
            linha.style.color = "white"; // texto claro pra ter contraste
          }

          let dadoPosicao = document.createElement("td");
          dadoPosicao.textContent = dado.posicao;
          linha.appendChild(dadoPosicao);

          let dadoAtleta = document.createElement("td");
          dadoAtleta.textContent = dado.atleta;
          linha.appendChild(dadoAtleta);

          let dadoTempo = document.createElement("td");
          dadoTempo.textContent = dado.tempo;
          linha.appendChild(dadoTempo);

          let dadoEquipe = document.createElement("td");
          let imagem = document.createElement("img");
          imagem.setAttribute("src", URL_IMAGENS[dado.equipe]);
          dadoEquipe.appendChild(imagem);
          linha.appendChild(dadoEquipe);

          tabela.appendChild(linha);
        });
      }

      // -------- BUSCA UMA PROVA NA PLANILHA E MONTA A TABELA --------
      async function carregarProva(prova, idTabela) {
        try {
          const resposta = await fetch(
            `${URL_PLANILHA}?prova=${encodeURIComponent(prova)}`
          );
          const dados = await resposta.json();
          montarTabela(dados, idTabela);
        } catch (erro) {
          console.error(`Erro ao carregar ${prova}:`, erro);
        }
      }

      // -------- LIGA CADA PROVA À SUA TABELA --------
      document.addEventListener("DOMContentLoaded", () => {
        const mapaProvas = {
          carabina: "tabela-carabina",
          pistola: "tabela-pistola",
          fgcent: "tabela-fgcent",
          fuzil: "tabela-fuzil",
        };

        Object.entries(mapaProvas).forEach(([prova, idTabela]) => {
          carregarProva(prova, idTabela);
        });
      });
    </script>
  </head>

  <body>
    <!-- Título -->
    <div class="header">
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/07/swm.png"
        alt="Ícone"
      />
      <h1>Natação - Resultados</h1>
    </div>

    <!-- Botões de navegação -->
    <div class="view-switch" aria-label="Selecionar prova">
      <button class="active" data-target="view-equipes">Equipes</button>
      <button data-target="view-carabina">Carabina 22</button>
      <button data-target="view-pistola">Pistola de Ar</button>
      <button data-target="view-fgcent">Fogo Central</button>
      <button data-target="view-fuzil">Fuzil</button>
    </div>

    <!-- EQUIPES (aqui você pode preencher manualmente o quadro geral) -->
    <section id="view-equipes">
      <table class="results-table">
        <tr>
          <th style="font-size: 28px">Equipe</th>
          <th style="font-size: 28px">🥇</th>
          <th style="font-size: 28px">🥈</th>
          <th style="font-size: 28px">🥉</th>
          <th style="font-size: 28px">Total de pontos</th>
        </tr>
        <tr>
          <td>
            <img
              src="https://scaer.com.br/wp-content/uploads/2025/06/2024-2028_Uiracu_Destaque-fill-350x351-removebg-preview-2.png"
              alt="Uiraçu"
            />
          </td>
          <td>1</td>
          <td>1</td>
          <td>-</td>
          <td>3055</td>
        </tr>
        <tr>
          <td>
            <img
              src="https://scaer.com.br/wp-content/uploads/2025/06/2023-2026_Athos_Destaque-fill-350x351-1.webp"
              alt="Athos"
            />
          </td>
          <td>1</td>
          <td>1</td>
          <td>-</td>
          <td>2803</td>
        </tr>
        <tr>
          <td>
            <img
              src="https://scaer.com.br/wp-content/uploads/2025/06/2025-2029_Perseu_Destaque-removebg-preview-1.png"
              alt="Perseu"
            />
          </td>
          <td>0</td>
          <td>0</td>
          <td>1</td>
          <td>2669</td>
        </tr>
        <tr>
          <td>
            <img
              src="https://scaer.com.br/wp-content/uploads/2025/06/2022-2025_Artemis_Destaque-fill-350x351-removebg-preview.png"
              alt="Ártemis"
            />
          </td>
          <td>0</td>
          <td>0</td>
          <td>1</td>
          <td>2552</td>
        </tr>
      </table>
    </section>

    <!-- UMA SECTION POR PROVA (linhas virão da planilha) -->

    <section id="view-carabina" class="hidden">
      <table class="results-table" id="tabela-carabina">
        <tr>
          <th colspan="4">Carabina 22</th>
        </tr>
        <tr>
          <th>Posição</th>
          <th>Atleta</th>
          <th>Tempo</th>
          <th>Equipe</th>
        </tr>
      </table>
    </section>

    <section id="view-pistola" class="hidden">
      <table class="results-table" id="tabela-pistola">
        <tr>
          <th colspan="4">Pistola de Ar</th>
        </tr>
        <tr>
          <th>Posição</th>
          <th>Atleta</th>
          <th>Tempo</th>
          <th>Equipe</th>
        </tr>
      </table>
    </section>

    <section id="view-fgcent" class="hidden">
      <table class="results-table" id="tabela-fgcent">
        <tr>
          <th colspan="4">Fogo Central</th>
        </tr>
        <tr>
          <th>Posição</th>
          <th>Atleta</th>
          <th>Tempo</th>
          <th>Equipe</th>
        </tr>
      </table>
    </section>

    <!-- Galeria -->
    <div class="gallery">
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/IMG_3556.jpg"
        alt="Prova 1"
      />
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/IMG_3572.jpg"
        alt="Prova 2"
      />
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/S0043372.jpg"
        alt="Premiação"
      />
    </div>

    <!-- Botão voltar -->
    <a href="https://scaer.com.br/esportes-2/" class="back-button"
      >← Voltar aos esportes</a
    >

    <!-- Script de troca de abas -->
    <script>
      const buttons = document.querySelectorAll(".view-switch button");
      const views = [
        "view-equipes",
        "view-carabina",
        "view-pistola",
        "view-fgcent",
        "view-fuzil",
      ];

      function showView(targetId) {
        views.forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.classList.toggle("hidden", id !== targetId);
        });
        buttons.forEach((b) => {
          b.classList.toggle("active", b.dataset.target === targetId);
          b.setAttribute(
            "aria-pressed",
            b.dataset.target === targetId ? "true" : "false"
          );
        });
      }

      buttons.forEach((btn) =>
        btn.addEventListener("click", () => showView(btn.dataset.target))
      );

      showView("view-equipes");
    </script>
  </body>
</html>
