<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placar OHMA</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Old+Standard+TT:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/pocketbase@0.19.0/dist/pocketbase.umd.js"></script>
    <style>
      @keyframes pontuacaoPulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.7;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes elasticStop {
        0% {
          transform: scale(1);
        }
        60% {
          transform: scale(1.3);
        }
        80% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes shadowPulse {
        0% {
          box-shadow: 0 0 30px rgba(41, 255, 216, 0.6);
        }
        50% {
          box-shadow: 0 0 100px rgba(41, 255, 216, 0.9);
        }
        100% {
          box-shadow: 0 0 30px rgba(41, 255, 216, 0.6);
        }
      }
      .pontuacao-elastica {
        animation: elasticStop 1s ease-out;
      }
      .highlight {
        background: #e8d9b5 !important;
        box-shadow: 0 0 15px rgba(218, 165, 32, 0.6) !important;
      }
      .first-place-change {
        background: #d4af37 !important;
        color: #956a04 !important;
      }

      body {
        font-family: "Old Standard TT", serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background: url("https://www.transparenttextures.com/patterns/old-paper.png"),
          #394059;
        color: #394059;
        min-height: 100vh;
      }

      h2 {
        font-family: "Cinzel", serif;
        font-size: 2rem;

        color: #5c3a21;
        margin-bottom: 30px;
      }

      .columns {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 1;
        max-width: 1400px; /* ajuste como quiser, ex: 600, 700, 800px */
        margin: 0 auto; /* centraliza */
        width: 100%;
      }

      .team {
        display: flex;
        align-items: center;
        background: rgba(255, 253, 245, 0.95);
        border: 2px solid #c9b18b;
        border-radius: 10px;
        padding: 10px;
        height: 220px;

        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        flex-direction: row;
        justify-content: space-between;
        transition: 2s ease;
      }

      .team:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .team img.team-main {
        width: 150px;
        height: 150px;
        border-radius: 30%;
        border: 3px solid #8b4513;
        object-fit: cover;
        margin-right: 20px;
        margin-left: 20px;
        padding-left: 2px;
        background: #fff;
      }

      .team img.team-brasao {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-left: 120px;
        margin-right: 80px;

        align-self: center;
      }

      .team-name {
        font-family: "Arial", serif;
        font-size: 55px;
        color: #5c3a21;
        display: flex;
        align-items: center;
        font-weight: bold;
        gap: 8px;
        margin-left: 80px;
      }

      .team-points {
        font-size: 4.3rem;
        font-weight: bold;
        color: #8b0000;
      }

      .team-info {
        display: flex;
        align-items: center;
        flex-grow: 1;
        margin-left: 20px;
      }
      .team-position-number {
        font-weight: bold;
        color: #8b4513;
        font-size: 4rem;
      }

      /* Responsivo */
      @media (max-width: 768px) {
        .columns {
          flex-direction: column;
          align-items: center;
        }

        .col {
          width: 100%;
          max-width: 500px;
        }
      }
      .container {
        max-width: 1150px;
        margin: 40px auto;
        border-radius: 5px;
        padding: 55px;
        box-shadow: 0 0 50px rgba(41, 255, 216, 0.6);
        position: relative;
        overflow: hidden;

        animation: shadowPulse 3s infinite ease-in-out; /* Adicione esta linha */
      }
      .gain-blink {
        animation: blinkGreen 1s ease 3;
      }

      .lose-blink {
        animation: blinkRed 1s ease 3;
      }

      .other-blink {
        animation: blinkYellow 1s ease 3;
      }

      @keyframes blinkGreen {
        0%,
        100% {
          background-color: rgba(255, 253, 245, 0.95);
        }
        50% {
          background-color: rgba(144, 238, 144, 0.95);
        }
      }

      @keyframes blinkRed {
        0%,
        100% {
          background-color: rgba(255, 253, 245, 0.95);
        }
        50% {
          background-color: rgba(255, 182, 193, 0.95);
        }
      }

      @keyframes blinkYellow {
        0%,
        100% {
          background-color: rgba(255, 253, 245, 0.95);
        }
        50% {
          background-color: rgba(255, 255, 160, 0.95);
        }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="columns">
        <ul id="col-1" class="col"></ul>
      </div>
    </div>

    <script>
      const pb = new PocketBase("https://simplyheron.fly.dev");

      let previousPoints = {};
      let previousFirstPlace = null;
      let previousOrder = [];

      async function fetchTeams() {
        try {
          const response = await pb
            .collection("placar")
            .getFullList({ sort: "-pontos" });

          const sorted = Object.entries(
            response.reduce((acc, record) => {
              acc[record.equipe] = {
                pontos: record.pontos,
                imagem: record.imagem
                  ? pb.files.getUrl(record, record.imagem)
                  : "https://via.placeholder.com/70",
                brasao: record.imagem2
                  ? pb.files.getUrl(record, record.imagem2)
                  : "https://via.placeholder.com/20",
              };
              return acc;
            }, {})
          ).sort((a, b) => b[1].pontos - a[1].pontos);

          const top3 = sorted.slice(0, 3);
          const col1 = document.getElementById("col-1");

          col1.innerHTML = "";

          const currentOrder = top3.map(([name]) => name);
          const indexMap = Object.fromEntries(
            currentOrder.map((name, i) => [name, i])
          );

          top3.forEach(([name, data], index) => {
            const li = document.createElement("li");
            li.className = "team";
            li.dataset.team = name;

            const link = document.createElement("a");
            link.href = `equipe.html?id=${encodeURIComponent(name)}`;
            link.style.textDecoration = "none";
            link.style.color = "inherit";
            link.appendChild(li);

            const teamInfo = document.createElement("div");
            teamInfo.className = "team-info";

            const img = document.createElement("img");
            img.src = data.imagem;
            img.className = "team-main";
            img.alt = name;

            const nameSpan = document.createElement("div");
            nameSpan.className = "team-name";

            const positionLabel = document.createElement("span");
            positionLabel.className = "team-position-number";
            positionLabel.textContent = `${index + 1}º`;

            const nameText = document.createElement("span");
            nameText.textContent = name;

            nameSpan.appendChild(positionLabel);
            nameSpan.appendChild(nameText);

            const brasao = document.createElement("img");
            brasao.src = data.brasao;
            brasao.className = "team-brasao";
            brasao.alt = "Brasão";

            teamInfo.appendChild(img);
            teamInfo.appendChild(nameSpan);
            teamInfo.appendChild(brasao);

            const points = document.createElement("div");
            points.className = "team-points";
            points.textContent = `${data.pontos} pts`;

            li.appendChild(teamInfo);
            li.appendChild(points);

            // ANIMAÇÃO DE MOVIMENTO
            const previousIndex = previousOrder.indexOf(name);
            if (previousIndex !== -1 && previousIndex !== index) {
              const offset = (previousIndex - index) * 160;
              li.style.transform = `translateY(${offset}px)`;
              li.style.transition = "transform 2s ease"; //
              setTimeout(() => {
                li.style.transform = "translateY(0)";
              }, 100);
            }

            // Insere na coluna correta
            col1.appendChild(link);

            // Animação de pontos
            if (
              previousPoints[name] !== undefined &&
              previousPoints[name] !== data.pontos
            ) {
              const diff = data.pontos - previousPoints[name];
              if (diff === 20) {
                li.classList.add("gain-blink");
              } else if (diff < 0) {
                li.classList.add("lose-blink");
              } else if (diff > 0) {
                li.classList.add("other-blink");
              }

              let atual = 0;
              let final = data.pontos;
              let embaralhador = setInterval(() => {
                atual = Math.floor(Math.random() * 1000);
                points.textContent = `${atual} pts`;
              }, 60);

              setTimeout(() => {
                clearInterval(embaralhador);
                points.textContent = `${final} pts`;
                points.classList.add("pontuacao-elastica");
                setTimeout(() => {
                  points.classList.remove("pontuacao-elastica");
                  li.classList.remove(
                    "gain-blink",
                    "lose-blink",
                    "other-blink"
                  );
                }, 1000);
              }, 2000);
            }

            // Destaque novo primeiro lugar
            if (
              index === 0 &&
              previousFirstPlace &&
              previousFirstPlace !== name
            ) {
              li.classList.add("first-place-change");
              setTimeout(() => li.classList.remove("first-place-change"), 3000);
            }

            previousPoints[name] = data.pontos;
          });

          previousFirstPlace = top3.length > 0 ? top3[0][0] : null;
          previousOrder = currentOrder;
        } catch (err) {
          console.error("Erro:", err);
        }
      }

      async function subscribeToUpdates() {
        pb.collection("placar").subscribe("*", () => fetchTeams());
      }

      fetchTeams();
      subscribeToUpdates();
    </script>

    </script>
  </body>
</html>
