<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados por Equipe</title>
    <link
      href="https://scaer.com.br/wp-content/uploads/2025/11/ChatGPT_Image_26_de_nov._de_2025__10_39_25-removebg-preview.png"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background: #f9f9f9;
        font-family: "Bebas Neue", sans-serif;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* --- 1ª linha (4 cards + buraco na coluna 3) --- */
      .grid a:nth-child(1) {
        grid-row: 1;
        grid-column: 1;
      }
      .grid a:nth-child(2) {
        grid-row: 1;
        grid-column: 2;
      }
      .grid a:nth-child(3) {
        grid-row: 1;
        grid-column: 4;
      }
      .grid a:nth-child(4) {
        grid-row: 1;
        grid-column: 5;
      }

      /* --- 2ª linha (5 cards, Geral no centro) --- */
      .grid a:nth-child(5) {
        grid-row: 2;
        grid-column: 1;
      }
      .grid a:nth-child(6) {
        grid-row: 2;
        grid-column: 2;
      }
      .grid a:nth-child(7) {
        grid-row: 2;
        grid-column: 3;
      } /* GERAL */
      .grid a:nth-child(8) {
        grid-row: 2;
        grid-column: 4;
      }
      .grid a:nth-child(9) {
        grid-row: 2;
        grid-column: 5;
      }

      /* --- 3ª linha (4 cards + buraco na coluna 3) --- */
      .grid a:nth-child(10) {
        grid-row: 3;
        grid-column: 1;
      }
      .grid a:nth-child(11) {
        grid-row: 3;
        grid-column: 2;
      }
      .grid a:nth-child(12) {
        grid-row: 3;
        grid-column: 4;
      }
      .grid a:nth-child(13) {
        grid-row: 3;
        grid-column: 5;
      }

      /* (Cards continuam iguais — seu CSS original segue abaixo) */
      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        padding: 20px;
        text-align: center;
        transition: transform 0.3s ease;
        animation: fadeInUp 1s ease forwards;
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }

      .icon {
        width: 60px;
        height: 60px;
        margin-bottom: 10px;
        transition: transform 0.3s ease;
      }
      .card:hover .icon {
        transform: scale(1.5);
      }

      .title {
        font-size: 22px;
        letter-spacing: 2px;
        color: #333;
      }

      @keyframes fadeInUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Cascata de atraso */
      .grid a:nth-child(1) {
        animation-delay: 0.1s;
      }
      .grid a:nth-child(2) {
        animation-delay: 0.2s;
      }
      .grid a:nth-child(3) {
        animation-delay: 0.3s;
      }
      .grid a:nth-child(4) {
        animation-delay: 0.4s;
      }
      .grid a:nth-child(5) {
        animation-delay: 0.5s;
      }
      .grid a:nth-child(6) {
        animation-delay: 0.6s;
      }
      .grid a:nth-child(7) {
        animation-delay: 0.7s;
      }
      .grid a:nth-child(8) {
        animation-delay: 0.8s;
      }
      .grid a:nth-child(9) {
        animation-delay: 0.9s;
      }
      .grid a:nth-child(10) {
        animation-delay: 1s;
      }
      .grid a:nth-child(11) {
        animation-delay: 1.1s;
      }
      .grid a:nth-child(12) {
        animation-delay: 1.2s;
      }
      .grid a:nth-child(13) {
        animation-delay: 1.2s;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <a href="https://scaer.com.br/esportes/resultadosatletismo" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/ath.png"
          alt="Atletismo"
          class="icon"
        />
        <div class="title">Atletismo</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosbasquete" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/bkb.png"
          alt="Basquete"
          class="icon"
        />
        <div class="title">Basquete</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosesgrima" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/fen.png"
          alt="Esgrima"
          class="icon"
        />
        <div class="title">Esgrima</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosfutebol" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/fbl.png"
          alt="Futebol"
          class="icon"
        />
        <div class="title">Futebol</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosjudo" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/jud.png"
          alt="Judô"
          class="icon"
        />
        <div class="title">Judô</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosnatacao" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/swm.png"
          alt="Natação"
          class="icon"
        />
        <div class="title">Natação</div>
      </a>

      <!-- 7º CARD = GERAL (centro da 2ª linha) -->
      <a href="https://scaer.com.br/esportes/quadrogeral" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/11/ChatGPT_Image_26_de_nov._de_2025__10_39_25-removebg-preview.png"
          alt="Quadro Geral"
          class="icon"
        />
        <div class="title">Geral</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosorientacao" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/ChatGPT-Image-15-de-jul.-de-2025-14_26_32-1.png"
          alt="Orientação"
          class="icon"
        />
        <div class="title">Orientação</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadospentatlo" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/mpn.png"
          alt="Pentatlo Militar"
          class="icon"
        />
        <div class="title">Pentatlo Militar</div>
      </a>

      <a href="https://scaer.com.br/resultadospolo/" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/wpo.png"
          alt="Polo Aquático"
          class="icon"
        />
        <div class="title">Polo Aquático</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadostiro" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/sho.png"
          alt="Tiro Esportivo"
          class="icon"
        />
        <div class="title">Tiro Esportivo</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadostriathlon" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/tri.png"
          alt="Triathlon"
          class="icon"
        />
        <div class="title">Triathlon</div>
      </a>

      <a href="https://scaer.com.br/esportes/resultadosvolei" class="card">
        <img
          src="https://scaer.com.br/wp-content/uploads/2025/07/vvo.png"
          alt="Voleibol"
          class="icon"
        />
        <div class="title">Voleibol</div>
      </a>
    </div>
  </body>
</html>
