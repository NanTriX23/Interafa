<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judô - Resultados</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Bebas Neue", sans-serif;
        margin: 0;
        background: #f4f4f4;
        color: #333;
        padding: 30px 20px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .header img {
        width: 60px;
        height: 60px;
      }
      .header h1 {
        font-size: 40px;
        letter-spacing: 2px;
      }

      .results-table {
        width: 100%;
        max-width: 1000px;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .results-table th,
      .results-table td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }
      .results-table th {
        background: #122;
        color: white;
      }
      .results-table tr:hover {
        background: #f0f0f0;
      }
      .results-table img {
        height: 50px;
      }

      .view-switch {
        max-width: 1000px;
        margin: 24px auto 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .view-switch button {
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.5px;
        font-size: 18px;
        padding: 10px 16px;
        border: 1px solid #122;
        background: white;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.2s ease, color 0.2s ease;
      }
      .view-switch button:hover {
        transform: translateY(-1px);
      }
      .view-switch button.active {
        background: #122;
        color: #fff;
      }

      .torneio {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        background-color: #f1f1f1;
        font-size: 15px;
      }

      .torneio .coluna {
        display: flex;
        flex-flow: row wrap;
        justify-content: space-around;
        width: 100%;
        height: 100%;
        min-height: 100%;
        border-bottom: 2px dashed #e5e5e5;
        padding-bottom: 2em;
        margin-bottom: 2em;
      }

      .torneio .jogo {
        margin: 0.5rem 0;
        width: 40%;
        flex-shrink: 1;
        background-color: #ffffff;
        padding: 0.3em;
        border: 1px solid transparent;
        border-radius: 0.1em;
        box-shadow: 0 2px 0 0 #e5e5e5;
        outline: none;

        display: flex;
        flex-flow: row;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 700px) {
        .torneio .jogo {
          flex-flow: column;
          align-items: center;
          width: 90%;
        }
      }

      .torneio .final .jogo,
      .torneio .terceiro .jogo {
        width: 60%;
      }

      .torneio .atleta {
        display: flex;
        flex-flow: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
        color: white;
        margin: 0.4em;
        padding: 0.3em;
      }

      .torneio .terceiro {
        margin-top: auto;
      }

      .gallery {
        max-width: 900px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }
      .gallery img:hover {
        transform: scale(1.05);
      }

      .hidden {
        display: none;
      }

      .back-button {
        display: block;
        width: max-content;
        margin: 40px auto 0;
        padding: 12px 24px;
        color: white;
        background: #122;
        text-decoration: none;
        border-radius: 8px;
      }
      .back-button:hover {
        background: #244;
      }
    </style>

    <script>
      // Imagens das equipes
      const URL_IMAGENS = {
        Perseu:
          "https://scaer.com.br/wp-content/uploads/2025/06/2025-2029_Perseu_Destaque-removebg-preview-1.png",
        Uiraçu:
          "https://scaer.com.br/wp-content/uploads/2025/11/Uiracuremovido.png",
        Athos:
          "https://scaer.com.br/wp-content/uploads/2025/06/2023-2026_Athos_Destaque-fill-350x351-1.webp",
        Ártemis:
          "https://scaer.com.br/wp-content/uploads/2025/11/artemisremovido-.png",
      };

      // Degradês por equipe
      const GRADIENTES_EQUIPE = {
        Perseu: "linear-gradient(90deg, #02091E, #12326F)",
        Uiraçu: "linear-gradient(90deg, #3A0202, #FF301A)",
        Athos: "linear-gradient(90deg, #3E2C00, #F4B000)",
        Ártemis: "linear-gradient(90deg, #00331C, #00A86B)",
      };

      // URL do Web App (Apps Script)
      const URL_PLANILHA =
        "https://script.google.com/macros/s/AKfycbw2UC7MrAdT73C6Zk6bE9jEiwuEKm94I52UcNceo9QbadNrRBPrwwH6h__MdQHVYLTqDA/exec";

      // -------- FUNÇÃO QUE MONTA A TABELA / TORNEIO --------
      function montarTabela(dados, idTabela) {
        console.log(`Montando tabela ${idTabela}`, dados);

        const tabela = document.getElementById(idTabela);
        if (!tabela) return;

        // Por Equipes (tabela simples)
        if (idTabela === "tabela-Por-Equipes") {
          // mantém as 2 primeiras linhas (título e cabeçalho)
          while (tabela.rows.length > 2) {
            tabela.deleteRow(2);
          }

          dados.forEach((dado) => {
            const linha = document.createElement("tr");

            // Equipe 1
            const tdEquipe1 = document.createElement("td");
            const img1 = document.createElement("img");
            img1.src = URL_IMAGENS[dado.equipe1] || "";
            img1.alt = dado.equipe1 || "";
            tdEquipe1.appendChild(img1);
            const gradiente1 = GRADIENTES_EQUIPE[dado.equipe1];
            if (gradiente1) {
              tdEquipe1.style.backgroundImage = gradiente1;
              tdEquipe1.style.color = "white";
            }
            linha.appendChild(tdEquipe1);

            // Placar
            const tdPlacar = document.createElement("td");
            tdPlacar.textContent = dado.placar || "-";
            linha.appendChild(tdPlacar);

            // Equipe 2
            const tdEquipe2 = document.createElement("td");
            const img2 = document.createElement("img");
            img2.src = URL_IMAGENS[dado.equipe2] || "";
            img2.alt = dado.equipe2 || "";
            tdEquipe2.appendChild(img2);
            const gradiente2 = GRADIENTES_EQUIPE[dado.equipe2];
            if (gradiente2) {
              tdEquipe2.style.backgroundImage = gradiente2;
              tdEquipe2.style.color = "white";
            }
            linha.appendChild(tdEquipe2);

            tabela.appendChild(linha);
          });
        } else {
          // -------- CHAVES DE TORNEIO (Ligeiro, Meio-Leve, etc.) --------

          function createJogo(dado) {
            const jogo = document.createElement("div");
            jogo.className = "jogo";

            const jogador1 = document.createElement("div");
            jogador1.className = "atleta";

            const jogador2 = document.createElement("div");
            jogador2.className = "atleta";

            if (dado) {
              // GANHADOR
              jogador1.textContent = dado.ganhador || "-";
              // Linha "sublinhada" verde (compatível com iOS)
              jogador1.style.borderBottom = "4px solid green";
              jogador1.style.paddingBottom = "2px";

              const gradiente1 = GRADIENTES_EQUIPE[dado.equipeganhador];
              if (gradiente1 && dado.equipeganhador) {
                jogador1.style.backgroundImage = gradiente1;
                jogador1.style.color = "white";
              } else {
                jogador1.style.color = "black";
              }

              // PERDEDOR
              jogador2.textContent = dado.perdedor || "-";
              // Linha "sublinhada" vermelha (compatível com iOS)
              jogador2.style.borderBottom = "4px solid red";
              jogador2.style.paddingBottom = "2px";

              const gradiente2 = GRADIENTES_EQUIPE[dado.equipeperdedor];
              if (gradiente2 && dado.equipeperdedor) {
                jogador2.style.backgroundImage = gradiente2;
                jogador2.style.color = "white";
              } else {
                jogador2.style.color = "black";
              }
            } else {
              // Casa vazia
              jogador1.textContent = "-";
              jogador2.textContent = "-";
              jogador1.style.color = "black";
              jogador2.style.color = "black";
            }

            jogo.appendChild(jogador1);
            jogo.appendChild(jogador2);

            return jogo;
          }

          // Limpa o container do torneio antes de montar
          tabela.innerHTML = "";

          let titulo, content;

          // Quartas de final (4 lutas: índices 0–3)
          const quartas = document.createElement("div");
          quartas.className = "quartas coluna";
          for (let i = 0; i < 4; i++) {
            quartas.appendChild(createJogo(dados[i]));
          }
          titulo = document.createElement("h2");
          content = document.createTextNode("Quartas de Final");
          titulo.appendChild(content);
          titulo.style.textAlign = "center";
          titulo.style.margin = "0 auto 0 auto";
          tabela.appendChild(titulo);
          tabela.appendChild(quartas);

          // Semi (2 lutas: índices 4–5)
          const semi = document.createElement("div");
          semi.className = "semi coluna";
          for (let i = 4; i < 6; i++) {
            semi.appendChild(createJogo(dados[i]));
          }
          titulo = document.createElement("h2");
          content = document.createTextNode("Semi Final");
          titulo.appendChild(content);
          titulo.style.textAlign = "center";
          titulo.style.margin = "0 auto 0 auto";
          tabela.appendChild(titulo);
          tabela.appendChild(semi);

          // Final (1 luta: índice 6)
          const final = document.createElement("div");
          final.className = "final coluna";
          final.appendChild(createJogo(dados[6]));
          titulo = document.createElement("h2");
          content = document.createTextNode("Final");
          titulo.appendChild(content);
          titulo.style.textAlign = "center";
          titulo.style.margin = "0 auto 0 auto";
          tabela.appendChild(titulo);
          tabela.appendChild(final);

          // Terceiro lugar (1 luta: índice 7)
          const terceiro = document.createElement("div");
          terceiro.className = "terceiro coluna";
          terceiro.appendChild(createJogo(dados[7]));
          titulo = document.createElement("h2");
          content = document.createTextNode("Terceiro Lugar");
          titulo.appendChild(content);
          titulo.style.textAlign = "center";
          titulo.style.margin = "0 auto 0 auto";
          tabela.appendChild(titulo);
          tabela.appendChild(terceiro);
        }
      }

      // -------- BUSCA UMA PROVA NA PLANILHA E MONTA --------
      async function carregarProva(prova, idTabela) {
        try {
          const resposta = await fetch(
            `${URL_PLANILHA}?prova=${encodeURIComponent(prova)}`
          );
          const dados = await resposta.json();
          montarTabela(dados, idTabela);
        } catch (erro) {
          console.error(`Erro ao carregar ${prova}:`, erro);
        }
      }

      // -------- INICIALIZAÇÃO --------
      document.addEventListener("DOMContentLoaded", () => {
        const mapaProvas = {
          "Por Equipes": "tabela-Por-Equipes",
          Ligeiro: "tabela-Ligeiro",
          "Meio Leve": "tabela-Meio-Leve",
          Leve: "tabela-Leve",
          "Meio Médio": "tabela-Meio-Médio",
          Médio: "tabela-Médio",
          "Meio Pesado": "tabela-Meio-Pesado",
          Absoluto: "tabela-Absoluto",
        };

        Object.entries(mapaProvas).forEach(([prova, idTabela]) => {
          carregarProva(prova, idTabela);
        });
      });
    </script>
  </head>

  <body>
    <!-- Título -->
    <div class="header">
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/07/jud.png"
        alt="Ícone Judô"
      />
      <h1>Judô - Resultados</h1>
    </div>

    <!-- Botões de navegação -->
    <div class="view-switch" aria-label="Selecionar prova">
      <button class="active" data-target="view-Por-Equipes">Por Equipes</button>
      <button data-target="view-Ligeiro">Ligeiro</button>
      <button data-target="view-Meio-Leve">Meio Leve</button>
      <button data-target="view-Leve">Leve</button>
      <button data-target="view-Meio-Médio">Meio Médio</button>
      <button data-target="view-Médio">Médio</button>
      <button data-target="view-Meio-Pesado">Meio Pesado</button>
      <button data-target="view-Absoluto">Absoluto</button>
    </div>

    <!-- UMA SECTION POR PROVA -->

    <section id="view-Por-Equipes" class="hidden">
      <table class="results-table" id="tabela-Por-Equipes">
        <tr>
          <th colspan="3" style="font-size: 28px">Resultado - Por Equipes</th>
        </tr>
        <tr>
          <th style="font-size: 20px">Equipe</th>
          <th style="font-size: 20px">Placar</th>
          <th style="font-size: 20px">Equipe</th>
        </tr>
      </table>
    </section>

    <section id="view-Ligeiro" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Ligeiro
      </h2>
      <div class="torneio" id="tabela-Ligeiro"></div>
    </section>

    <section id="view-Meio-Leve" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Meio Leve
      </h2>
      <div class="torneio" id="tabela-Meio-Leve"></div>
    </section>

    <section id="view-Leve" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Leve
      </h2>
      <div class="torneio" id="tabela-Leve"></div>
    </section>

    <section id="view-Meio-Médio" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Meio Médio
      </h2>
      <div class="torneio" id="tabela-Meio-Médio"></div>
    </section>

    <section id="view-Médio" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Médio
      </h2>
      <div class="torneio" id="tabela-Médio"></div>
    </section>

    <section id="view-Meio-Pesado" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Meio Pesado
      </h2>
      <div class="torneio" id="tabela-Meio-Pesado"></div>
    </section>

    <section id="view-Absoluto" class="hidden">
      <h2
        style="
          text-align: center;
          color: white;
          background-color: rgb(17, 34, 34);
          padding: 0.5em;
          border-radius: 0.8em;
          width: 50%;
          margin: 0 auto 1em auto;
        "
      >
        Absoluto
      </h2>
      <div class="torneio" id="tabela-Absoluto"></div>
    </section>

    <!-- Galeria -->
    <div class="gallery">
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/IMG_3317.jpg"
        alt="Prova 1"
      />
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/IMG_3349.jpg"
        alt="Prova 2"
      />
      <img
        src="https://scaer.com.br/wp-content/uploads/2025/11/IMG_3426.jpg"
        alt="Premiação"
      />
    </div>

    <!-- Botão voltar -->
    <a href="https://scaer.com.br/esportes-2/" class="back-button">
      ← Voltar aos esportes
    </a>

    <!-- Script de troca de abas -->
    <script>
      const buttons = document.querySelectorAll(".view-switch button");
      const views = [
        "view-Por-Equipes",
        "view-Ligeiro",
        "view-Meio-Leve",
        "view-Leve",
        "view-Meio-Médio",
        "view-Médio",
        "view-Meio-Pesado",
        "view-Absoluto",
      ];

      function showView(targetId) {
        views.forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.classList.toggle("hidden", id !== targetId);
        });
        buttons.forEach((b) => {
          b.classList.toggle("active", b.dataset.target === targetId);
          b.setAttribute(
            "aria-pressed",
            b.dataset.target === targetId ? "true" : "false"
          );
        });
      }

      buttons.forEach((btn) =>
        btn.addEventListener("click", () => showView(btn.dataset.target))
      );

      // Corrigido: abre "Por Equipes" ao carregar
      showView("view-Por-Equipes");
    </script>
  </body>
</html>
