<!DOCTYPE html>
<html lang="pt-BR">

    <style>
      body {
        font-family: "Bebas Neue", sans-serif;
        margin: 0;
        background: #f4f4f4;
        color: #333;
        padding: 30px 20px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .header img {
        width: 60px;
        height: 60px;
      }
      .header h1 {

        letter-spacing: 2px;
      }

      .results-table {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .results-table th,
      .results-table td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }
      .results-table th {
        background: #222;
        color: white;
      }
      .results-table tr:hover {
        background: #f0f0f0;
      }
      .results-table td img {
        height: 60px;
      }

      .gallery {
        max-width: 900px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
      }
      .gallery img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }
      .gallery img:hover {
        transform: scale(1.05);
      }

      .back-button {
        display: block;
        width: max-content;
        margin: 40px auto 0;
        padding: 12px 24px;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        background: #222;
      }
    </style>

    <script>
      // 🔗 MESMA URL DO WEB APP QUE VOCÊ USA NA NATAÇÃO
      const URL_PLANILHA =
        "https://script.google.com/macros/s/AKfycbxplaXp_QkqPO6vLBMoXkBdfELJLM1L3BInY_Kojgrzu7MNoJ4OodMc6_1qf9ardak/exec";

      // Escudos das equipes usadas no futebol
      const URL_IMAGENS = {
        Uiraçu:
          "https://scaer.com.br/wp-content/uploads/2025/06/2024-2028_Uiracu_Destaque-fill-350x351-removebg-preview-2.png",
        Athos: "https://scaer.com.br/wp-content/uploads/2025/06/2023-2026_Athos_Destaque-fill-350x351-1.webp",
        Perseu:
          "https://scaer.com.br/wp-content/uploads/2025/06/2025-2029_Perseu_Destaque-removebg-preview-1.png",
        Ártemis: "https://scaer.com.br/wp-content/uploads/2025/06/2022-2025_Artemis_Destaque-fill-350x351-removebg-preview.png",
        

        

        // se em algum jogo você usar AMAN/AFA/EN:
        AMAN: "https://scaer.com.br/wp-content/uploads/2025/08/AMAN.jpeg",
        AFA: "https://scaer.com.br/wp-content/uploads/2025/08/AFA.webp",
        EN: "https://scaer.com.br/wp-content/uploads/2025/08/EN.jpeg",
      };

      // Monta a tabela de jogos com base nos dados vindos do Apps Script
      function montarTabelaJogos(dados) {
        console.log("Dados recebidos do futebol:", dados);

        const tabela = document.getElementById("tabela-jogos");
        if (!tabela) return;

        // mantém título e cabeçalho (2 primeiras linhas) e apaga o resto
        while (tabela.rows.length > 2) {
          tabela.deleteRow(2);
        }





     

        dados.forEach((jogo) => {
          const linha = document.createElement("tr");


        
          
          // Coluna: número do jogo
          const tdJogo = document.createElement("td");
          tdJogo.textContent = jogo.jogo;
          tdJogo.style.fontSize = "24px";
          linha.appendChild(tdJogo);

          // Coluna: confronto (escudo vs escudo)
          const tdConfronto = document.createElement("td");

          const img1 = document.createElement("img");
         
         
          img1.src = URL_IMAGENS[jogo.time1] || ""
          img1.alt = jogo.time1;





          const img2 = document.createElement("img");
         img2.src = URL_IMAGENS[jogo.time2] || "";
img2.alt = jogo.time2;

          tdConfronto.appendChild(img1);
          tdConfronto.append(" vs ");
          tdConfronto.appendChild(img2);

          linha.appendChild(tdConfronto);














          // Coluna: placar
          const tdPlacar = document.createElement("td");
          tdPlacar.textContent = jogo.placar;
          tdPlacar.style.fontSize = "20px";
          linha.appendChild(tdPlacar);

          tabela.appendChild(linha);
        });
      }

      // Busca os dados do Apps Script (prova=futebol)
      async function carregarFutebol() {
        try {
          const resp = await fetch(
            "https://script.google.com/macros/s/AKfycbxplaXp_QkqPO6vLBMoXkBdfELJLM1L3BInY_Kojgrzu7MNoJ4OodMc6_1qf9ardak/exec?prova=polo",
            { cache: "no-cache" } // garante atualização sem cache
          );

          const dados = await resp.json();
          montarTabelaJogos(dados);
        } catch (erro) {
          console.error("Erro ao carregar dados do futebol:", erro);
        }
      }

      document.addEventListener("DOMContentLoaded", carregarFutebol);
    </script>
  </head>
